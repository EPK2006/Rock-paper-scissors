<!DOCTYPE html>

<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Rock Paper Scissors Game</title>
 
 <link rel="stylesheet" href="rps.css">

</head>

<body>

  <h1>Rock Paper Scissors</h1>

  <div class="choices">

    <button onclick="playRound('rock')">Rock</button>

    <img src="rock.png" alt="Rock" style="width:50px; height: 50px; vertical-align: middle;">

    

    <button onclick="playRound('paper')">Paper</button>

    <img src="paper.png" alt="Paper" style="width:50px; height: 50px; vertical-align: middle;">

    

    <button onclick="playRound('scissors')">Scissors</button>

    <img src="scissors2.png" alt="Scissors" style="width:50px; height: 50px; vertical-align: middle;">

  </div>



  <br><br>

  <div>User Chose:</div>

  <div id="userChoice"></div>

  <br><br>



  <br><br>

  <div>Computer Chose:</div>

  <div id="computerChoice"></div>

  <br><br>



    <div>Result: </div>

  <div id="result"></div>



  <script src="RPS.js"></script>

  

</body>

</html>
